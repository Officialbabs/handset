<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d45"/>
      <stop offset="1" stop-color="#1f1f25"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="0.55" stop-color="#4a7dff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- The window behind the phone: the desk's copy of its screen. -->
  <rect x="14" y="30" width="100" height="74" rx="14" fill="#e9e9ef"/>
  <rect x="14" y="30" width="100" height="74" rx="14" fill="none" stroke="#c9c9d3" stroke-width="2"/>
  <rect x="62" y="40" width="40" height="54" rx="7" fill="url(#screen)" opacity="0.55"/>
  <!-- The phone. -->
  <rect x="26" y="12" width="48" height="98" rx="12" fill="url(#body)"/>
  <rect x="30" y="16" width="40" height="90" rx="9" fill="url(#screen)"/>
  <path d="M30 25 Q30 16 39 16 L58 16 L30 62 Z" fill="url(#glint)"/>
  <rect x="44" y="20" width="12" height="3" rx="1.5" fill="#1f1f25" opacity="0.8"/>
  <!-- A touch, as the window shows one. -->
  <circle cx="50" cy="72" r="9" fill="#ffffff" opacity="0.35"/>
  <circle cx="50" cy="72" r="4.5" fill="#ffffff" opacity="0.9"/>
</svg>
